{% extends "base.html" %}
{% block title %}WineBuddy AI — Wine Selection{% endblock %}
{% block body %}
<div id="fullscreen-loader" class="wb-loader-overlay">
    <div class="wb-loader">
        <div class="wb-loader-dots"><span></span><span></span><span></span></div>
        <span class="wb-loader-label">Finding wine regions</span>
    </div>
</div>

<div id="content" class="wb-page wb-page-wide wb-hidden">
    <header class="wb-header">
        <div class="wb-brand">
            <div class="wb-logo-wrap">
                <img id="logo-img" src="{{ url_for('static', filename='images/logo.png') }}" alt="Top Dog Sommi" class="wb-logo">
            </div>
        </div>
        <p id="tagline1" class="wb-quote"></p>
        <p id="tagline2" class="wb-subtitle"></p>
    </header>
    <div class="wb-card-grid wb-card-grid-compact" id="wine-cards-container"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
    const fullscreenLoader = document.getElementById('fullscreen-loader');
    const content = document.getElementById('content');
    const wineCardsContainer = document.getElementById('wine-cards-container');
    const defaultLoaderLabel = 'Finding wine regions';

    function showWinePage() {
        fullscreenLoader.classList.add('wb-hidden');
        content.classList.remove('wb-hidden');
        const loaderLabel = fullscreenLoader.querySelector('.wb-loader-label');
        if (loaderLabel) {
            loaderLabel.textContent = defaultLoaderLabel;
        }
    }

    window.addEventListener('pageshow', function () {
        if (wineCardsContainer.children.length > 0) {
            showWinePage();
        }
    });

    document.addEventListener("DOMContentLoaded", function() {
        fetch('/wines')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                document.getElementById('tagline1').textContent = data.query_wine_pairings[0].WINE_HEADING;
                document.getElementById('tagline2').textContent = data.query_wine_pairings[0].WINE_DESCRIPTION;
                wineCardsContainer.innerHTML = '';

                const capitalizeFirstLetter = (string) =>
                    string.charAt(0).toUpperCase() + string.slice(1).toLowerCase();

                data.wines_country.forEach(wine => {
                    const wineName = capitalizeFirstLetter(wine.AI_CSTMR_NAME);
                    wineCardsContainer.innerHTML += `
                        <article class="wb-card">
                            <div class="wb-card-media">
                                <img src="${wine.IMG_URLBB_TXT}" alt="${wineName}" class="wb-card-img">
                            </div>
                            <div class="wb-card-body">
                                <p class="wb-card-label">${wineName}</p>
                                <button type="button" class="wb-btn wb-btn-primary wb-btn-sm" onclick="continueToWine('${wine.AI_CSTMR_NAME}')">Continue</button>
                            </div>
                        </article>`;
                });

                fullscreenLoader.classList.add('wb-hidden');
                content.classList.remove('wb-hidden');
            })
            .catch(() => {
                showWinePage();
                wineCardsContainer.innerHTML = '<p class="wb-error-text">Error loading wines. Please try again later.</p>';
            });
    });

    function slugify(text) {
        return text.toString().toLowerCase().trim()
            .replace(/\s+/g, '-')
            .replace(/[^\w\-]+/g, '')
            .replace(/\-\-+/g, '-')
            .replace(/^-+/, '')
            .replace(/-+$/, '');
    }

    function continueToWine(aiCstmrName) {
        const loaderLabel = fullscreenLoader.querySelector('.wb-loader-label');
        if (loaderLabel) {
            loaderLabel.textContent = 'Opening pairing assistant';
        }
        fullscreenLoader.classList.remove('wb-hidden');
        content.classList.add('wb-hidden');
        window.location.href = `/chat/${slugify(aiCstmrName)}`;
    }
</script>
{% endblock %}
