<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} — WineBuddy</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f0f0f;
            --sidebar-bg: #1a1a1a;
            --card-bg: #1e1e1e;
            --border: #2e2e2e;
            --gold: #c9a84c;
            --gold-hover: #e2c06e;
            --text: #e8e8e8;
            --text-muted: #888;
            --danger: #c0392b;
            --success: #27ae60;
            --info: #2980b9;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; font-size: 14px; }
        a { color: var(--gold); text-decoration: none; }
        a:hover { color: var(--gold-hover); }

        /* Sidebar */
        .sidebar { width: 220px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-brand { padding: 20px 16px; font-size: 16px; font-weight: 700; color: var(--gold); border-bottom: 1px solid var(--border); letter-spacing: 0.5px; }
        .sidebar-brand span { font-size: 11px; color: var(--text-muted); display: block; font-weight: 400; margin-top: 2px; }
        .sidebar-nav { flex: 1; padding: 12px 0; }
        .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: var(--text-muted); font-size: 13px; transition: all 0.15s; }
        .sidebar-nav a:hover, .sidebar-nav a.active { color: var(--gold); background: rgba(201,168,76,0.08); }
        .sidebar-nav a svg { width: 16px; height: 16px; flex-shrink: 0; }
        .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); }
        .sidebar-footer a { color: var(--text-muted); font-size: 12px; }
        .sidebar-footer a:hover { color: var(--danger); }

        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .topbar { padding: 14px 24px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; background: var(--sidebar-bg); }
        .topbar-title { font-size: 15px; font-weight: 600; color: var(--text); }
        .content { flex: 1; padding: 24px; overflow-y: auto; }

        /* Cards */
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .card-title { font-size: 14px; font-weight: 600; color: var(--text); }

        /* Buttons */
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 5px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; transition: all 0.15s; text-decoration: none; }
        .btn-primary { background: var(--gold); color: #000; }
        .btn-primary:hover { background: var(--gold-hover); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #e74c3c; color: #fff; }
        .btn-secondary { background: #2e2e2e; color: var(--text); }
        .btn-secondary:hover { background: #3a3a3a; color: var(--text); }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn svg { width: 14px; height: 14px; }

        /* Table */
        .table-wrap { overflow-x: auto; }
        table { border-collapse: collapse; font-size: 13px; width: max-content; min-width: 100%; }
        th { padding: 10px 12px; text-align: center; color: var(--text-muted); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; min-width: 120px; max-width: 200px; }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; min-width: 120px; max-width: 200px; word-break: break-word; white-space: normal; text-align: center; }
        td.td-actions-cell { min-width: 165px; max-width: 165px; width: 165px; overflow: visible; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .td-actions { display: flex; gap: 6px; white-space: nowrap; justify-content: center; }

        /* Forms */
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type=text], input[type=number], input[type=password], input[type=date], input[type=file], select, textarea {
            width: 100%; padding: 9px 12px; background: #121212; border: 1px solid var(--border);
            border-radius: 5px; color: var(--text); font-size: 13px; outline: none; transition: border-color 0.15s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--gold); }
        select option { background: #1a1a1a; }
        textarea { resize: vertical; min-height: 80px; font-family: inherit; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-row-3 { display: grid; grid-template-columns: 2fr 1fr auto; gap: 12px; align-items: end; }

        /* Alerts */
        .alert { padding: 10px 14px; border-radius: 5px; margin-bottom: 16px; font-size: 13px; }
        .alert-success { background: rgba(39,174,96,0.15); border: 1px solid rgba(39,174,96,0.3); color: #2ecc71; }
        .alert-error { background: rgba(192,57,43,0.15); border: 1px solid rgba(192,57,43,0.3); color: #e74c3c; }

        /* Badge */
        .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-muted { background: #2e2e2e; color: var(--text-muted); }
        .badge-gold { background: rgba(201,168,76,0.15); color: var(--gold); }

        /* Pagination */
        .pagination { display: flex; gap: 4px; align-items: center; margin-top: 16px; }
        .pagination a, .pagination span { padding: 5px 10px; border-radius: 4px; font-size: 12px; border: 1px solid var(--border); }
        .pagination a { color: var(--text); }
        .pagination a:hover { border-color: var(--gold); color: var(--gold); }
        .pagination span { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 600; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 24px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 15px; font-weight: 600; }
        .modal-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; line-height: 1; }
        .modal-close:hover { color: var(--text); }

        /* Column builder */
        .col-row { display: grid; grid-template-columns: 1fr 150px 90px 36px; gap: 8px; align-items: center; margin-bottom: 8px; }
        .col-row input, .col-row select { margin: 0; }
        .remove-col { background: none; border: 1px solid var(--border); color: var(--text-muted); border-radius: 4px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .remove-col:hover { border-color: var(--danger); color: var(--danger); }
        .checkbox-row { display: flex; align-items: center; gap: 8px; }
        input[type=checkbox] { width: auto; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-brand">
        WineBuddy
        <span>Admin Panel</span>
    </div>
    <nav class="sidebar-nav">
        <a href="{{ url_for('admin.dashboard') }}" class="{{ 'active' if request.endpoint == 'admin.dashboard' else '' }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Tables
        </a>
    </nav>
    <div class="sidebar-footer">
        <a href="{{ url_for('admin.logout') }}">&#x2192; Logout</a>
    </div>
</div>

<div class="main">
    <div class="topbar">
        <span class="topbar-title">{% block page_title %}Dashboard{% endblock %}</span>
    </div>
    <div class="content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</div>

{% block scripts %}{% endblock %}
</body>
</html>
