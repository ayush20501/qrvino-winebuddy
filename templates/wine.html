<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WineBuddy - Wine Selection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: rgb(179, 21, 21);
            color: white;
            font-family: 'Arial', sans-serif;
        }
        .container {
            max-width: 1200px;
        }
        .logo {
            max-width: 150px;
            margin-bottom: 1rem;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-img-top {
            height: 150px;
            object-fit: cover;
        }
        .btn-custom {
            background-color: green;
            color: white;
            border: none;
            padding: 0.25rem 0.75rem;
            font-size: 0.875rem;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .btn-custom:hover {
            background-color: green;
            color: white;
        }
        .footer {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 1rem 0;
            margin-top: 2rem;
        }
        .quote {
            font-style: italic;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: white;
        }
        .sommelier-text {
            font-weight: bold;
            margin-bottom: 2rem;
            color: white;
        }
        h1, h6 {
            color: white;
        }
        /* Fullscreen loader styles */
        .fullscreen-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(179, 21, 21);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #FFD700;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #content {
            display: none;
        }
    </style>
</head>
<body>
    <div id="fullscreen-loader" class="fullscreen-loader">
        <div class="loader"></div>
    </div>

    <div id="content" class="container py-5">
        <header class="text-center mb-5">
            <img id="logo-img" src="" alt="WineBuddy Logo" class="logo">
            <p id="tagline1" class="quote">"Life is too short to drink bad wine" (variant von Goethe)</p>
            <p id="tagline2" class="sommelier-text">Top Tog Sommelier - find me a great wine</p>
        </header>
        <div class="row g-4" id="wine-cards-container">
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const fullscreenLoader = document.getElementById('fullscreen-loader');
            const content = document.getElementById('content');
            const wineCardsContainer = document.getElementById('wine-cards-container');

            fetch('/wines')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.query_wine_logo[0].logo_img_urlbb_txt) {
                        document.getElementById('logo-img').src = data.query_wine_logo[0].logo_img_urlbb_txt;
                    }

                    document.getElementById('tagline1').textContent = data.query_wine_pairings[0].WINE_HEADING;
                    document.getElementById('tagline2').textContent = data.query_wine_pairings[0].WINE_DESCRIPTION;

                    wineCardsContainer.innerHTML = '';

                    const capitalizeFirstLetter = (string) => {
                        return string.charAt(0).toUpperCase() + string.slice(1).toLowerCase();
                    };

                    data.wines_country.forEach(wine => {
                        const wineName = capitalizeFirstLetter(wine.AI_CSTMR_NAME);
                        const wineCard = `
                            <div class="col-6 col-md-3">
                                <div class="card h-100 text-center">
                                    <img src="${wine.IMG_URLBB_TXT}" alt="${wineName}" class="card-img-top">
                                    <div class="card-body">
                                        <p class="card-text small">${wineName}</p>
                                        <a class="btn btn-custom btn-sm" onclick="continueToWine('${wine.AI_CSTMR_NAME}')">Continue</a>
                                    </div>
                                </div>
                            </div>
                        `;
                        wineCardsContainer.innerHTML += wineCard;
                    });

                    fullscreenLoader.style.display = 'none';
                    content.style.display = 'block';
                })
                .catch(error => {
                    console.error('There was a problem with the fetch operation:', error);
                    fullscreenLoader.style.display = 'none';
                    content.style.display = 'block';
                    wineCardsContainer.innerHTML = '<p class="text-center">Error loading wines. Please try again later.</p>';
                });
        });

        function continueToWine(aiCstmrName) {
            window.location.href = `/${aiCstmrName}`;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
