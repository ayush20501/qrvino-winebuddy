<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Your Favorite Wine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background-color: rgb(179, 21, 21);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 9px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Select Your Favorite Wine</h2>
        <form id="wineForm">
            {% for wine in wines %}
            <div class="p-3">
                <label>
                    <input type="radio" name="selected_wine" value="{{ wine.CSTMR_WINE_URL }}">
                    {{ wine.WINE_SELR_NM }}
                </label>
            </div>
            {% endfor %}
            <div class="text-center">
                <button type="submit" class="btn btn-lg btn-success mt-5">Continue</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById("wineForm").addEventListener("submit", function(event) {
            event.preventDefault();
            var selectedWineUrl = document.querySelector('input[name="selected_wine"]:checked').value;
            if (selectedWineUrl) {
                window.location.href = selectedWineUrl; 
            } else {
                alert("Please select a wine option.");
            }
        });
    </script>
</body>
</html>
