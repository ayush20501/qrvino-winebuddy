{% extends "base.html" %}
{% block title %}WineBuddy AI — Select Wine{% endblock %}
{% block body %}
<div class="wb-center-page">
    <div class="wb-page-narrow wb-panel">
        <h1 class="wb-panel-title">Select your favorite wine</h1>
        <form id="wineForm">
            <div class="wb-selection-list">
                {% for wine in wines %}
                <div class="wb-selection-item">
                    <input type="radio" name="selected_wine" id="wine_{{ loop.index }}" value="{{ wine.CSTMR_WINE_URL }}" {% if loop.first %}checked{% endif %}>
                    <label for="wine_{{ loop.index }}">{{ wine.WINE_SELR_NM }}</label>
                </div>
                {% endfor %}
            </div>
            <div class="mt-4">
                <button type="submit" class="wb-btn wb-btn-primary wb-btn-block">Continue</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
    document.getElementById("wineForm").addEventListener("submit", function(event) {
        event.preventDefault();
        const selected = document.querySelector('input[name="selected_wine"]:checked');
        if (selected && selected.value) {
            window.location.href = selected.value;
        } else {
            alert("Please select a wine option.");
        }
    });
</script>
{% endblock %}
