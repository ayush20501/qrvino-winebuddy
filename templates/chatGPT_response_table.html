<!DOCTYPE html>
<html lang="en">
<head>
    <title>ChatGPT Response</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        .custom-container {
            border: 3px solid rgb(110, 13, 13);
            border-radius: 12px;
            padding: 20px;
            background-color: #f0f8ff;
            margin: 10px;
        }
        .header-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .header-container h2 {
            margin: 0;
            font-size: 1.5rem;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn-green {
            background-color: green;
            border-color: green;
            color: white;
            padding: 8px 16px;
            font-size: 0.9rem;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        .btn-green:hover {
            background-color: green;
            border-color: green;
            color: white;
            transform: translateY(-2px);
        }
        @media (max-width: 576px) {
            .custom-container {
                margin: 5px;
                padding: 15px;
            }
            .header-container {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .header-container h2 {
                text-align: center;
            }
            .button-container {
                justify-content: center;
            }
            .btn-green {
                padding: 6px 12px;
                font-size: 0.85rem;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col">
                <div class="custom-container mt-3">
                    <div class="header-container">
                        <h2>ChatGPT Response</h2>
                        {% if rstrnt_ind != 'Y' %}
                        <div class="button-container">
                            <button onclick="goToScreen1()" class="btn btn-green">Back to Wines</button>
                            <button id="drinkButton" onclick="checkAndNavigate()" class="btn btn-green">Back to Beers</button>
                        </div>
                        {% endif %}
                    </div>
                    {% if token == 1 %}
                    {{ var | safe }}
                    {% else %}
                    {% for paragraph in paragraphs_with_links %}
                    <p>{{ paragraph | safe }}</p>
                    {% endfor %}
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
    <script>
        function goToScreen1() {
            window.location.href = '/explore-wine';
        }
        function checkAndNavigate() {
            window.location.href = '/explore-beer';
        }
    </script>
</body>
</html>
